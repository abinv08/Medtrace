name: medtrace_mobile
description: "MedTrace AI-Based Clinical Intelligence & Contactless Patient Monitoring Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  google_sign_in: ^6.2.1
  # Routing & UI
  go_router: ^13.2.0
  flutter_form_builder: ^9.2.1
  form_builder_validators: ^11.0.0
  provider: ^6.1.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

dependency_overrides:
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
